plugins { id 'com.android.application' }

android {
    namespace 'com.fulldeck.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fulldeck.player'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-retro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
